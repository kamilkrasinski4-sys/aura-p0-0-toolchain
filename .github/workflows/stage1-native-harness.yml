name: AURA P0-0 Stage 1 Native Harness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-sshsig-validation:
    name: Native OpenSSH Harness Validation (Network-Isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout AURA Tooling Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false

      - name: Require Generated Dependency Lock
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s requirements-stage1.lock ]]; then
            echo "FAIL: requirements-stage1.lock is absent/empty. Generate it in the approved CPython 3.12 + pip-tools builder using scripts/regenerate_stage1_lock.sh; do not hand-edit hashes."
            exit 1
          fi
          grep -Fq 'autogenerated by pip-compile' requirements-stage1.lock || {
            echo "FAIL: lock provenance does not identify pip-compile."
            exit 1
          }
          grep -Eq '^jsonschema==4\.23\.0([[:space:]\\]|$)' requirements-stage1.lock || {
            echo "FAIL: lock does not pin jsonschema==4.23.0."
            exit 1
          }
          grep -Eq '^rpds-py==' requirements-stage1.lock || {
            echo "FAIL: lock does not explicitly include rpds-py."
            exit 1
          }

      - name: Environment Identification and Fingerprinting
        id: env-id
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="p0_0_stage1_environment.log"
          {
            echo "AURA P0-0: ENVIRONMENT IDENTIFICATION"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "GITHUB_SHA=${GITHUB_SHA}"
            date -u +"TIMESTAMP_UTC=%Y-%m-%dT%H:%M:%SZ"
            echo "--- uname -a"; uname -a
            echo "--- git --version"; git --version
            echo "--- ssh -V"; ssh -V 2>&1
            echo "--- command -v ssh-keygen"; command -v ssh-keygen
            echo "--- command -v unshare"; command -v unshare
            echo "--- command -v ip"; command -v ip
            echo "--- python3.12 --version"; python3.12 --version
            echo "--- pip version"; python3.12 -m pip --version
            echo "--- tooling SHA-256"
            sha256sum \
              p0_0_manifest_schema.json \
              p0_0_manifest_validate.py \
              p0_0_evidence_capture.py \
              p0_0_evidence_capture.sh \
              p0_0_snapshot_verify.py \
              verify_p0_0_snapshot.sh \
              test_p0_0_harness.py \
              test_p0_0_harness.sh \
              requirements-stage1.in \
              requirements-stage1.lock \
              .github/workflows/stage1-native-harness.yml \
              scripts/regenerate_stage1_lock.sh \
              scripts/verify_stage1_lock.sh
          } | tee "${LOG_FILE}"

      - name: Install Hash-Locked Dependencies
        id: dependency-install
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="p0_0_stage1_dependencies.log"
          {
            python3.12 -m venv .venv
            source .venv/bin/activate
            python -m pip install --require-hashes --no-deps -r requirements-stage1.lock
            python -m pip check
            python - <<'PY'
          import importlib.metadata
          from jsonschema import FormatChecker
          from jsonschema.exceptions import FormatError
          
          required = {
              "jsonschema", "attrs", "jsonschema-specifications", "referencing", "rpds-py",
              "fqdn", "idna", "isoduration", "arrow", "python-dateutil", "six", "tzdata",
              "jsonpointer", "rfc3339-validator", "rfc3986-validator", "uri-template", "webcolors",
          }
          installed = {d.metadata["Name"].lower().replace("_", "-") for d in importlib.metadata.distributions() if d.metadata.get("Name")}
          missing = sorted(required - installed)
          if missing:
              raise SystemExit(f"missing required distributions: {missing}")
          checker = FormatChecker()
          checker.check("2026-10-15T21:03:21Z", "date-time")
          try:
              checker.check("2026-10-15T21:03:21", "date-time")
          except FormatError:
              print("PASS: FormatChecker rejects timezone-less date-time")
          else:
              raise SystemExit("FAIL: FormatChecker accepted timezone-less date-time")
          print("PASS: dependency graph installed with hash verification; pip check clean")
          PY
          } 2>&1 | tee "${LOG_FILE}"

      - name: Native SSHSIG Interoperability Preflight
        id: sshsig-preflight
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="p0_0_stage1_sshsig.log"
          {
            echo "OpenSSH native SSHSIG preflight"
            ssh -V 2>&1
            command -v ssh-keygen
            temp_dir="$(mktemp -d)"
            trap 'rm -rf -- "${temp_dir}"' EXIT
            ssh-keygen -q -t ed25519 -N "" -f "${temp_dir}/test_key" -C "preflight@aura.local"
            printf 'AURA stage 1 SSHSIG preflight payload\n' > "${temp_dir}/payload.txt"
            ssh-keygen -Y sign -f "${temp_dir}/test_key" -n aura-governance "${temp_dir}/payload.txt"
            pubkey="$(cat "${temp_dir}/test_key.pub")"
            printf 'preflight@aura.local namespaces="aura-governance" %s\n' "${pubkey}" > "${temp_dir}/allowed_signers"
            ssh-keygen -Y verify -f "${temp_dir}/allowed_signers" -I "preflight@aura.local" -n aura-governance -s "${temp_dir}/payload.txt.sig" < "${temp_dir}/payload.txt"
            echo "PASS: real OpenSSH SSHSIG signing and verification succeeded."
          } 2>&1 | tee "${LOG_FILE}"

      - name: Preflight Network Namespace and Run Harness in Same Namespace
        id: harness-execution
        shell: bash
        env:
          AURA_AUDITOR_IDENTITY: "CI GitHub Actions Auditor"
          # Non-secret sentinel only. The harness has local API mocks and must never use live API.
          GITHUB_TOKEN: "mock_token_no_live_access_permitted"
        run: |
          set -euo pipefail
          LOG_FILE="p0_0_stage1_harness_execution.log"
          chmod +x ./p0_0_evidence_capture.sh ./verify_p0_0_snapshot.sh ./test_p0_0_harness.sh
          # Ensure namespace-mapped users can read Python sources in this local checkout.
          find . -type f -name '*.py' -exec chmod a+r {} +
          test -r ./test_p0_0_harness.py || { echo "FAIL: harness Python source is not readable before namespace entry."; exit 1; }
          stat -c "HARNESS_SOURCE_MODE=%A %a uid=%u gid=%g path=%n" ./test_p0_0_harness.py
          HARNESS_ROOT="/tmp/aura-p0-0-stage1-harness-${GITHUB_RUN_ID}"
          rm -rf "${HARNESS_ROOT}"
          mkdir -p "${HARNESS_ROOT}"
          git ls-files -z | tar --null -T - -cf - | tar -xf - -C "${HARNESS_ROOT}"
          chmod -R a+rX "${HARNESS_ROOT}"
          test -r "${HARNESS_ROOT}/test_p0_0_harness.py" || { echo "FAIL: isolated harness copy is not readable."; exit 1; }
          export HARNESS_ROOT

          set +e
           sudo -n env "HARNESS_ROOT=${HARNESS_ROOT}" unshare -Urmn bash -c '
            set -euo pipefail
            source .venv/bin/activate
            cd "${HARNESS_ROOT}"
            ip link set dev lo up
             echo "AURA_NETWORK_ISOLATION_LOG_BEGIN"

            link_output="$(ip -o link show)"
            line_count="$(printf "%s\\n" "${link_output}" | wc -l | tr -d " ")"
            if [[ "${line_count}" != "1" || "${link_output}" != *": lo:"* ]]; then
              echo "FAIL CI-04: expected exactly one interface (lo); found:" 
              printf "%s\\n" "${link_output}"
              exit 1
            fi

            routes4="$(ip -4 route show)"
            routes6="$(ip -6 route show)"
            if [[ -n "${routes4}" || -n "${routes6}" ]]; then
              echo "FAIL CI-04: routes exist inside the test network namespace."
              echo "IPv4 routes: ${routes4}"
              echo "IPv6 routes: ${routes6}"
              exit 1
            fi
            {
              echo "PASS CI-04: current harness namespace has only lo and no IPv4/IPv6 routes."
              echo "--- ip -o link show"
              printf "%s\n" "${link_output}"
              echo "--- ip -4 route show"
              printf "%s\n" "${routes4}"
              echo "--- ip -6 route show"
              printf "%s\n" "${routes6}"
             }
             echo "AURA_NETWORK_ISOLATION_LOG_END"

            ./test_p0_0_harness.sh
          ' 2>&1 | tee "${LOG_FILE}"
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
           awk '/^AURA_NETWORK_ISOLATION_LOG_BEGIN$/ { capture=1; next } /^AURA_NETWORK_ISOLATION_LOG_END$/ { capture=0; next } capture { print }' "${LOG_FILE}" > p0_0_stage1_network_isolation.log
           grep -Fq "PASS CI-04: current harness namespace has only lo and no IPv4/IPv6 routes." p0_0_stage1_network_isolation.log || { echo "FAIL CI-04: network isolation log lacks the PASS assertion."; exit 1; }

          harness_status="${pipeline_status[0]}"
          tee_status="${pipeline_status[1]}"
          if [[ "${harness_status}" -ne 0 ]]; then
            echo "FAIL: isolated harness exited with ${harness_status}"
            exit "${harness_status}"
          fi
          if [[ "${tee_status}" -ne 0 ]]; then
            echo "FAIL: tee exited with ${tee_status}"
            exit "${tee_status}"
          fi
          grep -Fq "HARNESS RESULT: 20/20 test cases passed (4 positive + 16 negative)" "${LOG_FILE}" || {
            echo "FAIL CI-08: final 20/20 accounting line is absent."
            exit 1
          }
          echo "PASS CI-08: all 20 harness cases passed."

      - name: Preserve All Stage 1 Logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # actions/upload-artifact v4.4.3
        with:
          name: aura-p0-0-stage1-native-evidence
          path: |
            p0_0_stage1_environment.log
            p0_0_stage1_dependencies.log
            p0_0_stage1_sshsig.log
            p0_0_stage1_network_isolation.log
            p0_0_stage1_harness_execution.log
          retention-days: 90
          if-no-files-found: warn
