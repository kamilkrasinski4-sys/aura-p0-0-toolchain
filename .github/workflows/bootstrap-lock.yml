name: AURA P0-0 Bootstrap Dependencies Lock

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-p0-0-lock-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-lock:
    name: Generate and verify CPython 3.12 lock
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_NO_INPUT: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout tooling repository without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          persist-credentials: false

      - name: Set up CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python v5.6.0
        with:
          python-version: "3.12"
          architecture: x64

      - name: Generate, verify, and fingerprint the lock
        id: bootstrap-lock
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "AURA P0-0: BOOTSTRAP LOCK GENERATION"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_ATTEMPT=${GITHUB_RUN_ATTEMPT}"
            echo "REPOSITORY=${GITHUB_REPOSITORY}"
            echo "REF=${GITHUB_REF}"
            echo "COMMIT=${GITHUB_SHA}"
            date -u +"TIMESTAMP_UTC=%Y-%m-%dT%H:%M:%SZ"
            echo "--- runner"
            uname -a
            cat /etc/os-release
            echo "--- git"
            git --version
            echo "--- CPython"
            python3.12 --version
            python3.12 -m pip --version
            echo "--- install bootstrap resolver"
            python3.12 -m pip install --disable-pip-version-check --no-input "pip-tools==7.4.1"
            echo "--- resolver provenance"
            python3.12 -c 'import importlib.metadata, sys; print("python=" + sys.version.splitlines()[0]); print("pip-tools=" + importlib.metadata.version("pip-tools"))'
            python3.12 -m pip freeze | sort
            echo "--- input/tooling fingerprints before generation"
            sha256sum \
              requirements-stage1.in \
              scripts/regenerate_stage1_lock.sh \
              scripts/verify_stage1_lock.sh \
              .github/workflows/stage1-native-harness.yml \
              .github/workflows/bootstrap-lock.yml
            echo "--- generate and internally verify"
            PYTHON_BIN=python3.12 ./scripts/regenerate_stage1_lock.sh
            echo "--- independent post-generation lock verification"
            PYTHON_BIN=python3.12 ./scripts/verify_stage1_lock.sh
            test -s requirements-stage1.lock
            grep -Fq 'autogenerated by pip-compile' requirements-stage1.lock
            grep -Eq '^jsonschema==4\.23\.0([[:space:]\\]|$)' requirements-stage1.lock
            grep -Eq '^rpds-py==' requirements-stage1.lock
            echo "--- final evidence fingerprints"
            sha256sum requirements-stage1.lock | tee bootstrap_lock.sha256
            sha256sum requirements-stage1.in scripts/regenerate_stage1_lock.sh scripts/verify_stage1_lock.sh \
              .github/workflows/stage1-native-harness.yml .github/workflows/bootstrap-lock.yml
            echo "BOOTSTRAP_LOCK_RESULT: PASS"
          } 2>&1 | tee bootstrap_lock_generation.log

      - name: Preserve bootstrap evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # actions/upload-artifact v4.4.3
        with:
          name: aura-p0-0-lock-bootstrap-evidence
          path: |
            requirements-stage1.lock
            bootstrap_lock_generation.log
            bootstrap_lock.sha256
            requirements-stage1.in
            scripts/regenerate_stage1_lock.sh
            scripts/verify_stage1_lock.sh
            .github/workflows/bootstrap-lock.yml
            .github/workflows/stage1-native-harness.yml
          retention-days: 90
          if-no-files-found: warn
